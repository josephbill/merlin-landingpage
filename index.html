<html>
  <!--  the html elements contains the head and body elements as content   -->
  <head>
    <!-- head elements represents attributes/more information about the metadata of the web page -->
    <!-- stylings , fonts , : link to css pages for styling purposes  -->
    <!-- title of the window/active tab of the webpage -->
    <title>Merlin Class Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Latest compiled and minified CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- internal css -->
    <style></style>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="grid-container">
      <header id="navbar">
        <!-- A grey horizontal navbar that becomes vertical on small screens -->
        <nav class="navbar navbar-expand-sm bg-light justify-content-center">
          <div class="container-fluid">
            <!-- Links -->
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">About Us</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Apply Here</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">School Outlook</a>
              </li>
            </ul>
          </div>
        </nav>
      </header>
      <nav id="sideMenu">
        <div id="flex-container">
          <div>
            <p class="text-center">
              <a href="#">Grades</a>
            </p>
          </div>
          <div>
            <p class="text-center">
              <a href="#">Attendance</a>
            </p>
          </div>
          <div>
            <p class="text-center">
              <a href="#">Meet Recordings</a>
            </p>
          </div>
          <div>
            <p class="text-center">
              <a href="#">Help / Support</a>
            </p>
          </div>
        </div>
      </nav>
      <section id="mainContent">
        <p id="paraJs">Hello JS implementation example here</p>
        <button class="btn btn-success" id="clickEffect">
          Click Me to change content
        </button>
      </section>
      <footer id="footer" class="container">
        <form action="" id="contactForm">
          <div class="mb-3 mt-3">
            <label for="email" class="form-label">Email:</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter email"
              name="email"
            />
          </div>
          <div class="mb-3">
            <label for="phoneNo" class="form-label">Phone Number:</label>
            <input
              type="number"
              class="form-control"
              id="phoneNo"
              placeholder="Enter Phone"
              name="phoneNo"
            />
          </div>
          <div class="mb-3">
            <label for="phoneNo" class="form-label">Full Name:</label>
            <input
              type="text"
              class="form-control"
              id="fName"
              placeholder="Enter Phone"
              name="fName"
            />
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </div>
    </footer>

    <!-- write JS / JS needs HTML elements to work with if utilized F.E implementation tool -->
    <script></script>
    <!-- or you can link the html to an external JS file -->
    <script src="js/script.js" defer></script>
  </body>
</html>
